<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Get HiddenBites</title>
  <meta name="description" content="Real food spots curated by locals. Free on iOS and Android." />
  <meta property="og:title" content="Get HiddenBites" />
  <meta property="og:description" content="Real food spots curated by locals. Free on iOS and Android." />
  <meta property="og:image" content="https://hiddenbites.app/icon.png" />
  <link rel="icon" href="/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,900;1,9..144,700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #F4F0E9; --card: #FFFDF8; --border: #F0E4D2; --ink: #191512;
      --warmgray: #A79E90; --orange: #E8642A;
      --serif: 'Fraunces', Georgia, serif; --sans: 'Plus Jakarta Sans', -apple-system, sans-serif;
    }
    body {
      font-family: var(--sans); background: var(--paper); color: var(--ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; -webkit-font-smoothing: antialiased;
    }
    .card {
      max-width: 420px; width: 100%; background: var(--card); border: 1.5px solid var(--border);
      border-radius: 6px; padding: 38px 30px 30px; text-align: center; position: relative;
      transform: rotate(-0.7deg); box-shadow: 0 26px 60px rgba(25,21,18,0.13);
    }
    .card::before { content: ''; position: absolute; inset: 9px; border: 1px dashed var(--border); border-radius: 3px; pointer-events: none; }
    .stamp {
      display: inline-block; border: 2px solid var(--orange); color: var(--orange); border-radius: 8px;
      padding: 6px 12px; font-size: 10px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase;
      transform: rotate(-2deg); margin-bottom: 18px; background: var(--card);
    }
    .icon { width: 66px; height: 66px; border-radius: 17px; border: 1.5px solid var(--border); transform: rotate(3deg); margin-bottom: 18px; }
    h1 { font-family: var(--serif); font-size: 32px; font-weight: 900; letter-spacing: -1px; line-height: 1.06; margin-bottom: 12px; }
    h1 em { font-style: italic; color: var(--orange); font-weight: 700; }
    .lede { font-family: var(--serif); font-style: italic; font-size: 15.5px; color: var(--warmgray); line-height: 1.65; margin-bottom: 26px; }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      background: var(--ink); color: var(--card); text-decoration: none;
      padding: 15px 22px; border-radius: 15px; font-size: 14.5px; font-weight: 800;
      border: 1.5px solid var(--ink); transition: transform 0.2s, background 0.2s, border-color 0.2s;
    }
    .btn + .btn { margin-top: 10px; }
    .btn:hover { background: var(--orange); border-color: var(--orange); transform: translateY(-2px); }
    .btn.secondary { background: transparent; color: var(--ink); border-color: var(--border); }
    .btn.secondary:hover { background: transparent; color: var(--orange); border-color: var(--orange); }
    .inapp-hint {
      margin-top: 16px; font-size: 12.5px; font-weight: 600; line-height: 1.5;
      color: var(--orange); background: #FAEDE2; border: 1px dashed rgba(232,100,42,0.4);
      border-radius: 12px; padding: 10px 12px;
    }
    .note { font-size: 12.5px; margin-top: 18px; }
    .note a { color: var(--warmgray); font-weight: 600; text-decoration: none; }
    .note a:hover { color: var(--orange); }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <div class="card">
    <div class="stamp">Verified Hidden Bite</div>
    <div><img src="/icon.png" alt="HiddenBites" class="icon" /></div>
    <h1>Find food<br/><em>only locals know</em></h1>
    <p class="lede">Real spots, curated by the people who actually eat there. Free on iOS and Android.</p>
    <div id="stores">
      <a class="btn" id="ios" data-store="ios" href="https://apps.apple.com/app/hiddenbites-find-local-gems/id6760585986">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
        Download on the App Store
      </a>
      <a class="btn" id="android" data-store="android" href="https://play.google.com/store/apps/details?id=com.kaithomasdev.hiddenbites">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3,20.5V3.5C3,2.91 3.34,2.39 3.84,2.15L13.69,12L3.84,21.85C3.34,21.6 3,21.09 3,20.5M16.81,15.12L6.05,21.34L14.54,12.85L16.81,15.12M20.16,10.81C20.5,11.08 20.75,11.5 20.75,12C20.75,12.5 20.53,12.9 20.18,13.18L17.89,14.5L15.39,12L17.89,9.5L20.16,10.81M6.05,2.66L16.81,8.88L14.54,11.15L6.05,2.66Z"/></svg>
        Get it on Google Play
      </a>
    </div>
    <p class="inapp-hint" data-inapp-hint hidden></p>
    <p class="note"><a href="https://hiddenbites.app">or browse hiddenbites.app →</a></p>
  </div>

  <script src="/store.js"></script>
</body>
</html>
